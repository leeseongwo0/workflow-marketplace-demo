# Project-local Codex settings.
# The root model is selected with: codex --profile sol-high
# Project settings load only when the repository is trusted.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_verbosity = "low"

[sandbox_workspace_write]
network_access = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
# Compatibility default. Named Luna agents below request "max" explicitly.
default_subagent_reasoning_effort = "xhigh"
interrupt_message = true
