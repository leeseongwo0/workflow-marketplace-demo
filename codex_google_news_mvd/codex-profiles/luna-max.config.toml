# Copy to ~/.codex/luna-max.config.toml
# Some Codex CLI builds may reject "max" in TOML even when the model picker offers Max.
# If that occurs, use luna-xhigh-fallback or select Max interactively with /model.
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
model_verbosity = "low"
approval_policy = "on-request"
